<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>境外运价</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    body { background: #f6f7f9; color: #18202a; }
    .app-shell { min-height: 100%; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
    .app-shell.sidebar-collapsed { grid-template-columns: 58px minmax(0, 1fr); }
    .sidebar { padding: 14px; background: #111827; color: #fff; display: grid; align-content: start; gap: 12px; }
    .sidebar-toggle { width: 100%; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(255,255,255,.08); color: #fff; padding: 8px 10px; font: inherit; cursor: pointer; }
    .brand { display: grid; gap: 4px; padding: 4px 2px 10px; border-bottom: 1px solid rgba(255,255,255,.16); }
    .brand strong { font-size: 17px; }
    .brand span { font-size: 12px; color: rgba(255,255,255,.72); }
    .nav-btn { width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: rgba(255,255,255,.06); color: #fff; padding: 10px 11px; font: inherit; font-size: 14px; cursor: pointer; }
    .nav-btn[aria-pressed="true"] { background: #0f766e; border-color: #0f766e; }
    .nav-btn span { display: block; }
    .nav-icon { display: grid !important; place-items: center; width: 24px; height: 24px; color: #fff; font-size: 16px; }
    .nav-text { min-width: 0; }
    .nav-label { color: #fff; font-size: 14px; font-weight: 650; }
    .nav-hint { margin-top: 3px; color: rgba(255,255,255,.72); font-size: 12px; }
    .sidebar-collapsed .brand span, .sidebar-collapsed .brand strong, .sidebar-collapsed .nav-text { display: none; }
    .sidebar-collapsed .sidebar { padding: 12px 8px; }
    .sidebar-collapsed .nav-btn { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 10px 6px; }
    .sidebar-collapsed .sidebar-toggle { text-align: center; padding: 10px 6px; }
    .workspace { min-width: 0; display: grid; grid-template-columns: minmax(390px, 30vw) minmax(620px, 1fr); min-height: 100vh; }
    .control-pane { min-width: 0; padding: 10px 14px; display: grid; gap: 8px; align-content: start; background: #fff; border-right: 1px solid #d8dde5; overflow: auto; }
    .module-panel { display: none; gap: 8px; }
    .module-panel.active { display: grid; }
    .topline { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .query-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #f9fafb; }
    .query-bar label { font-size: 13px; color: #4c5968; font-weight: 650; }
    .query-bar input, .query-bar select { height: 30px; min-width: 180px; border: 1px solid #cfd6df; border-radius: 6px; padding: 0 9px; font: inherit; font-size: 13px; background: #fff; }
    .query-bar button { height: 32px; border: 1px solid #1f2937; border-radius: 6px; background: #1f2937; color: #fff; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .query-bar button:disabled { opacity: .58; cursor: not-allowed; }
    .query-status { font-size: 13px; color: #4c5968; min-height: 1em; }
    .query-status.error { color: #b91c1c; }
    .map-provider { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #f9fafb; }
    .map-provider strong { font-size: 13px; color: #4c5968; }
    .map-provider button { height: 30px; border: 1px solid #cfd6df; border-radius: 6px; background: #fff; color: #18202a; padding: 0 10px; font: inherit; font-size: 13px; cursor: pointer; }
    .map-provider button[aria-pressed="true"] { background: #0f766e; border-color: #0f766e; color: #fff; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    .stats, .countries { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #4c5968; }
    .stats strong { color: #18202a; }
    .pill { display: inline-flex; gap: 5px; align-items: center; padding: 4px 8px; border: 1px solid #d8dde5; border-radius: 999px; background: #f9fafb; }
    .pill.removed { color: #991b1b; background: #fff1f2; border-color: #fecdd3; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .route-panel { display: grid; gap: 7px; padding: 9px 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #f9fafb; }
    .truck-panel { display: grid; gap: 8px; padding: 9px 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #f9fafb; }
    .truck-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
    .truck-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .truck-form input { flex: 1 1 100%; min-width: 220px; height: 38px; border: 1px solid #cfd6df; border-radius: 6px; padding: 0 12px; font: inherit; font-size: 15px; background: #fff; }
    .truck-form label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: #4c5968; font-weight: 650; }
    .truck-form select { height: 34px; min-width: 170px; border: 1px solid #cfd6df; border-radius: 6px; padding: 0 9px; font: inherit; font-size: 13px; background: #fff; }
    .truck-form button { height: 38px; border: 1px solid #0f766e; border-radius: 6px; background: #0f766e; color: #fff; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 650; cursor: pointer; }
    .truck-form button:disabled { opacity: .58; cursor: not-allowed; }
    .truck-station-group { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .truck-station-group span { font-size: 13px; color: #4c5968; font-weight: 650; }
    .truck-station-group button { height: 30px; border: 1px solid #cfd6df; border-radius: 6px; background: #fff; color: #18202a; padding: 0 9px; font-size: 13px; font-weight: 650; }
    .truck-station-group button[aria-pressed="true"] { background: #0f766e; border-color: #0f766e; color: #fff; }
    .truck-status { font-size: 13px; color: #4c5968; }
    .truck-status.error { color: #b91c1c; }
    .truck-market-reference { display: none; padding: 8px 9px; border: 1px solid #d8dde5; border-radius: 6px; background: #fff; color: #4c5968; font-size: 12px; line-height: 1.45; }
    .truck-market-reference.active { display: block; }
    .truck-market-reference b { color: #18202a; }
    .truck-freight-breakdown { display: none; padding: 8px 9px; border: 1px solid #d8dde5; border-radius: 6px; background: #fff; font-size: 12px; color: #4c5968; }
    .truck-freight-breakdown.active { display: grid; gap: 6px; }
    .truck-freight-breakdown strong { color: #18202a; }
    .truck-breakdown-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 8px; }
    .truck-breakdown-grid span { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid #eef1f4; padding-top: 5px; }
    .truck-breakdown-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .truck-breakdown-actions button, .market-filter select { height: 28px; border: 1px solid #cfd6df; border-radius: 6px; background: #fff; color: #18202a; padding: 0 8px; font: inherit; font-size: 12px; cursor: pointer; }
    .truck-copy-status { color: #64748b; }
    .market-filter { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #4c5968; }
    .market-table { table-layout: fixed; min-width: 0; font-size: 11.5px; }
    .market-table th, .market-table td { padding: 7px 4px; vertical-align: top; white-space: normal; overflow-wrap: anywhere; }
    .market-table th:nth-child(1), .market-table td:nth-child(1) { width: 29%; }
    .market-table th:nth-child(2), .market-table td:nth-child(2) { width: 21%; }
    .market-table th:nth-child(3), .market-table td:nth-child(3) { width: 18%; text-align: right; }
    .market-table th:nth-child(4), .market-table td:nth-child(4) { width: 32%; }
    .truck-table-wrap { overflow-x: visible; }
    .route-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
    .route-head strong { font-size: 14px; }
    .route-text { color: #18202a; font-size: 13px; overflow-wrap: anywhere; }
    .route-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 460px; font-size: 12px; }
    th, td { text-align: left; padding: 8px 7px; border-top: 1px solid #e1e5ea; white-space: nowrap; }
    th { color: #4c5968; font-weight: 650; }
    .truck-table { table-layout: fixed; min-width: 0; font-size: 11.5px; }
    .truck-table th, .truck-table td { padding: 7px 4px; vertical-align: top; }
    .truck-table th:nth-child(1), .truck-table td:nth-child(1) { width: 24px; text-align: center; color: #64748b; }
    .truck-table th:nth-child(2), .truck-table td:nth-child(2) { width: 36%; white-space: normal; overflow-wrap: anywhere; }
    .truck-table th:nth-child(3), .truck-table td:nth-child(3) { width: 60px; text-align: right; }
    .truck-table th:nth-child(4), .truck-table td:nth-child(4) { width: 52px; text-align: right; }
    .truck-table th:nth-child(5), .truck-table td:nth-child(5) { width: 70px; text-align: right; }
    .truck-table b { display: block; margin-bottom: 2px; line-height: 1.25; }
    .truck-city { display: block; color: #64748b; font-size: 11px; line-height: 1.25; }
    .truck-metric { white-space: nowrap; font-variant-numeric: tabular-nums; }
    #truck-distance-results tr { cursor: pointer; }
    #truck-distance-results tr.active-route td { background: #e6f4ef; }
    .rail-panel { display: grid; gap: 10px; padding: 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #f9fafb; }
    .rail-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
    .rail-head strong { font-size: 14px; }
    .rail-head span, .rail-status, .rail-note { font-size: 13px; color: #4c5968; }
    .rail-status.error { color: #b91c1c; }
    .rail-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; align-items: end; }
    .rail-field { display: grid; gap: 4px; min-width: 0; font-size: 13px; color: #4c5968; font-weight: 650; }
    .rail-field input, .rail-field select { width: 100%; min-width: 0; height: 34px; border: 1px solid #cfd6df; border-radius: 6px; padding: 0 9px; font: inherit; font-size: 13px; background: #fff; box-sizing: border-box; }
    .rail-field.hidden { display: none; }
    .rail-options { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .rail-option { display: flex; gap: 7px; align-items: center; min-height: 32px; padding: 6px 8px; border: 1px solid #d8dde5; border-radius: 6px; background: #fff; font-size: 13px; color: #18202a; }
    .rail-option.hidden { display: none; }
    .rail-option input { margin: 0; }
    .rail-form button { height: 38px; border: 1px solid #0f766e; border-radius: 6px; background: #0f766e; color: #fff; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 650; cursor: pointer; }
    .rail-form button:disabled { opacity: .58; cursor: not-allowed; }
    .rail-result { display: grid; gap: 8px; padding: 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #fff; }
    .rail-result.hidden { display: none; }
    .rail-total { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .rail-total strong { font-size: 22px; font-variant-numeric: tabular-nums; }
    .rail-total span { font-size: 13px; color: #4c5968; }
    .rail-breakdown { min-width: 0; font-size: 12px; }
    .rail-breakdown th:nth-child(2), .rail-breakdown td:nth-child(2), .rail-breakdown th:nth-child(3), .rail-breakdown td:nth-child(3) { text-align: right; }
    .rail-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #4c5968; }
    .rail-analytics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .rail-metric { padding: 8px; border: 1px solid #d8dde5; border-radius: 6px; background: #f9fafb; }
    .rail-metric span { display: block; color: #64748b; font-size: 11px; margin-bottom: 3px; }
    .rail-metric strong { font-size: 15px; font-variant-numeric: tabular-nums; }
    .rail-observed { display: grid; gap: 6px; padding: 9px; border: 1px solid #d8dde5; border-radius: 6px; background: #f9fafb; font-size: 12px; color: #18202a; }
    .rail-observed.hidden { display: none; }
    .rail-observed strong { font-size: 13px; }
    .rail-observed-path { overflow-wrap: anywhere; line-height: 1.45; }
    .rail-strategy { display: grid; gap: 6px; padding: 9px; border: 1px solid #d8dde5; border-radius: 6px; background: #f9fafb; font-size: 12px; color: #18202a; }
    .rail-strategy.hidden { display: none; }
    .rail-strategy-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .rail-strategy-item { display: grid; gap: 2px; padding: 7px 8px; border: 1px solid #d8dde5; border-radius: 6px; background: #fff; }
    .rail-strategy-item span { color: #4c5968; overflow-wrap: anywhere; }
    .rail-map-label { color: #1f2937; background: rgba(255,255,255,.96); border: 1px solid #cfd6df; border-radius: 4px; padding: 2px 5px; font-size: 12px; font-weight: 650; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.16); }
    .rail-placeholder { display: grid; place-items: center; height: 100%; min-height: 420px; padding: 24px; box-sizing: border-box; background: #eef3f7; color: #4c5968; }
    .rail-placeholder-inner { max-width: 620px; display: grid; gap: 10px; }
    .rail-placeholder h2 { margin: 0; color: #18202a; font-size: 22px; }
    .rail-placeholder p { margin: 0; line-height: 1.5; }
    .map-pane { min-width: 0; min-height: 100vh; }
    #map { width: 100%; height: 100%; min-height: 420px; background: #e7edf3; }
    .status, .legend, .removed-box { padding: 8px 10px; background: rgba(255,255,255,.96); border: 1px solid #cfd6df; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.12); font-size: 13px; line-height: 1.35; }
    .removed-box { max-width: 360px; color: #4c5968; }
    .removed-box b { color: #991b1b; }
    .legend div { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.24); flex: none; }
    .swatch.port { border-radius: 3px; background: #f97316; }
    .swatch.border { border-radius: 2px; background: #0891b2; transform: rotate(45deg); }
    .cn { background: #d7263d; } .kz { background: #2563eb; } .ru { background: #7c3aed; } .by { background: #059669; } .pl { background: #ea580c; }
    .start { background: #138a36; } .end { background: #111827; }
    .point-popup, .port-popup, .border-popup { min-width: 245px; max-width: 340px; }
    .point-popup h2, .port-popup h2, .border-popup h2 { margin: 0 0 6px; font-size: 15px; }
    .point-popup p, .port-popup p, .border-popup p { margin: 4px 0; font-size: 13px; }
    .geo-status { margin-top: 7px; padding-top: 7px; border-top: 1px solid #d8dde5; color: #4c5968; }
    .port-label { color: #7c2d12; background: rgba(255,255,255,.95); border: 1px solid #fed7aa; border-radius: 4px; padding: 2px 5px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .border-label { color: #155e75; background: rgba(255,255,255,.95); border: 1px solid #a5f3fc; border-radius: 4px; padding: 2px 5px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .truck-distance-label { color: #0f3b35; background: rgba(255,255,255,.96); border: 1px solid #99d1c5; border-radius: 4px; padding: 2px 5px; font-size: 12px; font-weight: 650; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.16); }
    .truck-station-icon, .truck-destination-icon, .truck-return-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: #fff; font-size: 15px; font-weight: 800; border: 3px solid #fff; box-shadow: 0 2px 9px rgba(15,23,42,.35); }
    .truck-station-icon { background: #0f766e; }
    .truck-destination-icon { background: #dc2626; }
    .truck-return-icon { background: #2563eb; }
    @media (max-width: 760px) {
      .app-shell { grid-template-columns: 1fr; }
      .app-shell.sidebar-collapsed { grid-template-columns: 1fr; }
      .sidebar { grid-template-columns: 1fr 1fr; }
      .brand { grid-column: 1 / -1; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(420px, 1fr); }
      .control-pane { padding: 9px 11px; border-right: 0; border-bottom: 1px solid #d8dde5; max-height: 52vh; }
      .map-pane { min-height: 48vh; }
      .stats, .countries { font-size: 12px; }
      .route-panel, .truck-panel { padding: 8px; }
      .rail-form, .rail-options { grid-template-columns: 1fr; }
      .rail-analytics { grid-template-columns: 1fr; }
      .rail-total strong { font-size: 19px; }
      .truck-table thead { display: none; }
      .truck-table, .truck-table tbody, .truck-table tr, .truck-table td { display: block; width: 100%; }
      .truck-table tr { padding: 8px 0; border-top: 1px solid #e1e5ea; }
      .truck-table td { border-top: 0; padding: 3px 0; text-align: left !important; }
      .truck-table td:first-child { display: none; }
      .truck-table td:nth-child(2) { width: 100%; }
      .truck-table td:nth-child(n+3) { display: inline-block; width: calc(33.333% - 4px); }
      .truck-table td:nth-child(n+3)::before { content: attr(data-label); display: block; margin-bottom: 2px; color: #64748b; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="模块导航">
      <div class="brand"><strong>境外运价</strong><span>铁路 / 卡车 / 市场参考</span></div>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="折叠菜单" aria-expanded="true">☰</button>
      <button class="nav-btn" type="button" data-module="truck" aria-pressed="true" title="卡车距离"><span class="nav-icon" aria-hidden="true">↔</span><span class="nav-text"><span class="nav-label">卡车距离</span><span class="nav-hint">地址到站点公路距离</span></span></button>
      <button class="nav-btn" type="button" data-module="rail" aria-pressed="false" title="铁路运价"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-text"><span class="nav-label">铁路运价</span><span class="nav-hint">俄线公共报价查价</span></span></button>
      <button class="nav-btn" type="button" data-module="market" aria-pressed="false" title="市场参考"><span class="nav-icon" aria-hidden="true">€</span><span class="nav-text"><span class="nav-label">市场参考</span><span class="nav-hint">燃油/指数/报价源</span></span></button>
    </aside>
    <main class="workspace">
      <div class="control-pane">
        <div class="map-provider" aria-label="地图底图">
          <strong>底图</strong>
          <button type="button" data-map-provider="esri-street" aria-pressed="true">Esri街道</button>
          <button type="button" data-map-provider="esri-imagery" aria-pressed="false">Esri卫星</button>
          <button type="button" data-map-provider="openstreetmap" aria-pressed="false">OSM备用</button>
          <button type="button" id="cache-map-tiles">缓存当前地图</button>
          <span class="truck-status" id="tile-cache-status"></span>
        </div>
        <section class="module-panel active" id="module-truck" aria-label="卡车派送距离实时查询">
          <div class="truck-panel">
            <div class="truck-head"><strong>卡车派送距离实时查询</strong><span id="truck-nearest">输入地址后计算各站点距离</span></div>
            <form class="truck-form" id="truck-distance-form">
              <input id="truck-address-input" value="JUD. BRASOV, ORS.GHIMBAV, Str. Hermann Oberth, Nr.23, Hala5, locatia 1, Romania" autocomplete="off" placeholder="输入收货地址，或输入坐标：45.6877, 25.51944">
              <label for="truck-return-station">还空地
                <select id="truck-return-station">
                  <option value="">不还空</option>
                </select>
              </label>
              <div class="truck-station-group" id="truck-station-group" role="group" aria-label="站点区域">
                <span>站点区域</span>
                <button type="button" data-station-group="auto" aria-pressed="true">自动</button>
                <button type="button" data-station-group="europe" aria-pressed="false">欧洲</button>
                <button type="button" data-station-group="central_asia" aria-pressed="false">中亚</button>
                <button type="button" data-station-group="russia" aria-pressed="false">俄罗斯</button>
                <button type="button" data-station-group="belarus" aria-pressed="false">白罗斯</button>
              </div>
              <button id="truck-distance-button" type="submit">计算距离</button>
              <span class="truck-status" id="truck-distance-status"></span>
            </form>

        '山口/Dostyk': '阿拉山口 / 多斯特克',
        '果斯/Altynkol': '霍尔果斯 / 阿腾科里',
      })[borderCrossing] || borderCrossing;

    function formatRailDestinationSummary(rate) {

      const code = rate.stationCode || meta.stationCode || '-';

    function destinationSearchValues(record) {
      const cn = record.localNameCn || railDestinationNameCn[record.destinationName] || '';
      return [
        record.destinationName,
        record.localName,
        cn,
        record.stationCode,
        cn ? `${cn} / ${record.destinationName}` : '',
        cn ? `${cn} / ${record.destinationName} / ${record.stationCode || ''}` : '',
      ].filter(Boolean).map(normalizeRailText);
    }
    function resolveRailDestinationName(rawDestination, rawStationCode, borderCrossing, pricingMode) {
      const records = railDestinationRecords(borderCrossing, pricingMode);
      const destination = normalizeRailText(rawDestination);
      if (destination) {
        const exact = records.find(record => destinationSearchValues(record).includes(destination));
        if (exact) return exact.destinationName;
        const partial = records.find(record => destinationSearchValues(record).some(value => value.includes(destination) || destination.includes(value)));
        if (partial) return partial.destinationName;
      }
      const code = normalizeRailText(rawStationCode);
      if (code) {
        const byCode = records.find(record => normalizeRailText(record.stationCode) === code);
        if (byCode) return byCode.destinationName;
      }
      if (!destination) return records[0] ? records[0].destinationName : '';
      return rawDestination;

        const name = border.matchedPortShortName || `${border.fromCountryCode}-${border.toCountryCode}`;
        const confidence = border.confidence == null ? '-' : Math.round(Number(border.confidence) * 100) + '%';
        L.marker([border.lat, border.lon], { icon: borderIcon, zIndexOffset: 1100 }).bindPopup(`<div class="border-popup"><h2>${escapeHtml(name)}</h2><p><b>穿越：</b>${escapeHtml(border.fromCountry)} → ${escapeHtml(border.toCountry)}</p><p><b>时间：</b>${escapeHtml(formatTime(border.crossingTime))}</p><p><b>轨迹点：</b>${escapeHtml(border.fromPoint)} → ${escapeHtml(border.toPoint)}</p><p><b>匹配口岸：</b>${escapeHtml(border.matchedPortShortName || border.matchedPortName || '疑似边境通道')}</p><p><b>口岸距离：</b>${border.matchedDistanceKm == null ? '-' : escapeHtml(border.matchedDistanceKm) + ' km'}</p><p><b>置信度：</b>${confidence}</p><p>${escapeHtml(border.note || '')}</p><p><b>坐标：</b>${escapeHtml(formatCoord(border.lon))}, ${escapeHtml(formatCoord(border.lat))}</p></div>`).addTo(map);
        L.marker([border.lat, border.lon], { icon: L.divIcon({ className: 'border-label', html: escapeHtml(name), iconAnchor: [-14, -14] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
      });
      map.fitBounds(L.latLngBounds(latlngs), { padding: [32, 32] });
      if (removedPoints.length) { const box = L.control({ position: 'topright' }); box.onAdd = function() { const div = L.DomUtil.create('div', 'removed-box'); const p = removedPoints[0]; div.innerHTML = `<b>已剔除漂移点</b><br>原始第 ${p.idx} 点：${formatTime(p.time)}<br>${formatCoord(p.lon)}, ${formatCoord(p.lat)}<br>前段 ${p.prevSpeed} km/h，后段 ${p.nextSpeed} km/h，绕行 ${p.detourRatio}x`; return div; }; box.addTo(map); }
      const legend = L.control({ position: 'bottomright' }); legend.onAdd = function() { const div = L.DomUtil.create('div', 'legend'); div.innerHTML = '<div><span class="swatch start"></span>起点</div><div><span class="swatch cn"></span>中国段</div><div><span class="swatch kz"></span>哈萨克斯坦段</div><div><span class="swatch ru"></span>俄罗斯段</div><div><span class="swatch by"></span>白俄罗斯段</div><div><span class="swatch pl"></span>波兰段</div><div><span class="swatch border"></span>自动边境</div><div><span class="swatch end"></span>终点</div>'; return div; }; legend.addTo(map);
      setTimeout(() => map.invalidateSize(), 200);
    }
    window.addEventListener('error', event => { const mapEl = document.getElementById('map'); if (mapEl && !mapEl.classList.contains('leaflet-container')) { mapEl.innerHTML = '<div style="padding:16px;color:#b91c1c;">页面脚本错误：' + escapeHtml(event.message) + '</div>'; } });
    bindTruckStationGroupControls();
    bindTruckDistanceForm();
    bindRailRateForm();
    bindModuleNav();
    bindSidebarToggle();
        bindMapProviderControls();
    bindTileCacheControls();
        loadTruckReturnStations();
    renderMarketReferenceModule();
    loadRailRates();
    initTruckMap();
  </script>
</body>
</html>
